<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout — Kingsley Watches</title><link rel="stylesheet" href="assets/style.css"></head>
<body>
<header class="site-header"><a class="brand" href="index.html"><span>KINGSLEY</span><small>WATCHES</small></a><div class="header-actions"><a class="cart-link" href="cart.html">Cart <span id="cart-count">0</span></a></div></header>
<main><section class="page-hero compact"><p class="eyebrow">CHECKOUT</p><h1>Complete your order.</h1></section><section class="section checkout-layout"><form id="checkout-form" class="checkout-form"><label>Full name<input required name="name" autocomplete="name"></label><label>Phone number<input required name="phone" autocomplete="tel"></label><label>Email<input type="email" name="email" autocomplete="email"></label><label>Delivery address<textarea required name="address" rows="3"></textarea></label><div class="two-col"><label>City<input required name="city"></label><label>Postal code<input name="postal"></label></div><label>Order notes<textarea name="notes" rows="3"></textarea></label><button class="btn btn-dark full" type="submit">Place Cash on Delivery Order</button><p class="form-note">Demo order flow: connect your preferred order/email/backend service before launch.</p></form><aside class="cart-summary"><p class="eyebrow">ORDER</p><div id="checkout-items"></div><div class="summary-row"><span>Total</span><strong id="checkout-total">$0.00</strong></div></aside></section></main>
<script src="assets/app.js"></script></body></html>
